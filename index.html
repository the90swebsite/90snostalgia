<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90’s Nostalgia Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #3B00FD;
      --green: #00F92A;
      --cyan: #04CAF4;
      --magenta: #F906D6;
      --lime: #D1F60A;
      --ink: #12004a;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(249, 6, 214, 0.35), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(4, 202, 244, 0.35), transparent 40%),
        linear-gradient(160deg, var(--blue), var(--ink));
    }

    .hero {
      text-align: center;
      padding: 4rem 1.5rem 2rem;
    }

    .hero h1 {
      font-family: "Bungee", Impact, "Arial Black", sans-serif;
      font-weight: 400;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 1.1;
      letter-spacing: 0.02em;
      color: var(--lime);
      text-shadow:
        3px 3px 0 var(--magenta),
        6px 6px 0 var(--cyan),
        9px 9px 0 var(--green);
    }

    .hero p {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1.5rem 4rem;
    }

    .counter-card {
      text-align: center;
      padding: 2rem 2.5rem;
      border: 4px solid var(--green);
      border-radius: 16px;
      background: rgba(18, 0, 74, 0.7);
      box-shadow:
        0 0 24px rgba(0, 249, 42, 0.5),
        8px 8px 0 var(--magenta);
      max-width: 100%;
    }

    .count-label {
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: clamp(0.95rem, 3.5vw, 1.2rem);
      font-weight: bold;
      color: var(--cyan);
    }

    .count-display {
      margin: 0.75rem 0 1.5rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    #count {
      font-family: "Courier New", monospace;
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: bold;
      color: var(--green);
      text-shadow: 0 0 12px var(--green);
    }

    .count-unit {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: bold;
      color: var(--magenta);
      text-shadow: 0 0 8px var(--magenta);
    }

    #nostalgia-btn {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--ink);
      background: var(--lime);
      border: 3px solid var(--magenta);
      border-radius: 999px;
      padding: 0.85rem 2.2rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--magenta);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    #nostalgia-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--magenta);
    }

    #nostalgia-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--magenta);
    }

    #nostalgia-btn:focus-visible,
    #music-btn:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 4px;
    }

    #music-btn {
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      color: var(--ink);
      background: var(--cyan);
      border: 3px solid var(--green);
      border-radius: 999px;
      padding: 0.7rem 1.8rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--green);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    #music-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--green);
    }

    #music-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--green);
    }

    #music-note {
      min-height: 1.2em;
      font-size: 0.85rem;
      opacity: 0.8;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 1rem 1.5rem 1.5rem;
      font-size: 0.85rem;
      opacity: 0.8;
      line-height: 1.6;
    }

    footer a {
      color: var(--lime);
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>90’s Nostalgia Online</h1>
    <p>Dial-up dreams, neon vibes, and good times.</p>
  </header>

  <main>
    <section class="counter-card" aria-live="polite">
      <span class="count-label">How Nostalgic are you?</span>
      <div class="count-display">
        <span id="count">0</span>
        <span class="count-unit">nostalgias</span>
      </div>
      <button id="nostalgia-btn" type="button">Click for Nostalgia</button>
    </section>

    <button id="music-btn" type="button" aria-pressed="false">&#9654; Play Music</button>
    <p id="music-note"></p>

    <audio id="bg-music" loop preload="none"></audio>
  </main>

  <footer>
    Best viewed at 800x600. Made with love.<br>
    Music: “<a href="https://budgetpixel.com/background-music/retro-90s-eurodance-a9adcbd8" target="_blank" rel="noopener">Retro 90s Eurodance</a>”
    by BudgetPixel AI, licensed under
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.
  </footer>

  <script>
    (function () {
      var count = 0;
      var countEl = document.getElementById("count");
      var button = document.getElementById("nostalgia-btn");

      button.addEventListener("click", function () {
        count += 1;
        countEl.textContent = count;
      });
    })();

    (function () {
      // Direct audio link to "Retro 90s Eurodance" by BudgetPixel AI (CC BY 4.0).
      // To use your own downloaded file instead, change this to "90s-music.mp3".
      var MUSIC_SRC = "https://cdn.budgetpixel.com/audio-library/music/retro-eurodance-upbeat-energetic-driving-atxds8.wav";

      var audio = document.getElementById("bg-music");
      var musicBtn = document.getElementById("music-btn");
      var note = document.getElementById("music-note");

      audio.src = MUSIC_SRC;
      audio.volume = 0.5;

      function setPlaying(isPlaying) {
        musicBtn.innerHTML = isPlaying ? "&#10074;&#10074; Pause Music" : "&#9654; Play Music";
        musicBtn.setAttribute("aria-pressed", String(isPlaying));
      }

      musicBtn.addEventListener("click", function () {
        note.textContent = "";
        if (audio.paused) {
          audio.play().then(function () {
            setPlaying(true);
          }).catch(function () {
            note.textContent = "Could not play the music. Check your internet connection or the MUSIC_SRC line in the script.";
            setPlaying(false);
          });
        } else {
          audio.pause();
          setPlaying(false);
        }
      });

      audio.addEventListener("error", function () {
        note.textContent = "Music file not found or blocked. Check the MUSIC_SRC line in the script.";
        setPlaying(false);
      });
    })();
  </script>
</body>
</html>
