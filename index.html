<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90’s Nostalgia Online</title>
  <style>
    :root {
      --bg-1: #1b0b3a;
      --bg-2: #3a0ca3;
      --neon-pink: #ff2e93;
      --neon-cyan: #00e5ff;
      --neon-yellow: #ffe600;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 46, 147, 0.25), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 229, 255, 0.25), transparent 40%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .hero {
      text-align: center;
      padding: 4rem 1.5rem 2rem;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      letter-spacing: 0.04em;
      color: var(--neon-yellow);
      text-shadow:
        3px 3px 0 var(--neon-pink),
        6px 6px 0 var(--neon-cyan);
    }

    .hero p {
      margin-top: 1rem;
      font-size: 1.1rem;
      opacity: 0.85;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1.5rem 4rem;
    }

    .counter-card {
      text-align: center;
      padding: 2rem 2.5rem;
      border: 3px solid var(--neon-cyan);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.45);
    }

    .count-label {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    #count {
      display: block;
      margin: 0.5rem 0 1.5rem;
      font-family: "Courier New", monospace;
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: bold;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px var(--neon-cyan);
    }

    #nostalgia-btn {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: bold;
      color: #1b0b3a;
      background: var(--neon-yellow);
      border: 3px solid var(--neon-pink);
      border-radius: 999px;
      padding: 0.85rem 2.2rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--neon-pink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    #nostalgia-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--neon-pink);
    }

    #nostalgia-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--neon-pink);
    }

    #nostalgia-btn:focus-visible {
      outline: 3px solid var(--neon-cyan);
      outline-offset: 4px;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>90’s Nostalgia Online</h1>
    <p>Dial-up dreams, neon vibes, and good times.</p>
  </header>

  <main>
    <section class="counter-card" aria-live="polite">
      <span class="count-label">Nostalgia Level</span>
      <span id="count">0</span>
      <button id="nostalgia-btn" type="button">Nostalgia Counter</button>
    </section>
  </main>

  <footer>Best viewed at 800x600. Made with love.</footer>

  <script>
    (function () {
      var count = 0;
      var countEl = document.getElementById("count");
      var button = document.getElementById("nostalgia-btn");

      button.addEventListener("click", function () {
        count += 1;
        countEl.textContent = count;
      });
    })();
  </script>
</body>
</html>
